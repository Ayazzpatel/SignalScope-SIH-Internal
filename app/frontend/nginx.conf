server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # API requests go to the FastAPI container — same origin for the browser, so cookies just work.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # needed for Server-Sent Events (batch progress)
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
