[project]
name = "signalscope-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is owned by `ruff format`; long user-facing strings stay unbroken

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
