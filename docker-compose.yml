services:
  backend:
    build: ./app/backend
    environment:
      ENVIRONMENT: production
      DETECTOR: ${DETECTOR:-mock}
      CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8000:8000" # API + interactive docs at http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./app/frontend
    ports:
      - "8080:80" # App at http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
